function exitDG(){if(!DG)return;mtier=0;E.length=0;E.push(...OVER);OVER=null;EP.length=0;for(let i=drops.length-1;i>=0;i--)if(drops[i].x>W)drops.splice(i,1);P.x=DG.ret.x;P.y=DG.ret.y;DG=null;camX=null;PT.cd=2;sfx(500,.3,'triangle',.06)}
function dgBossDead(){DG.bossDead=1;const n=DG.n;INV.coins+=60+n*30;P.mat+=4+n;giveGem();if(n%3==0||n==DGMAX)giveGem();if(n==1&&!own.includes('w3'))giveItem('w3');if(n==1&&!PET.have.rat){PET.have.rat=1;if(!PET.cur)PET.cur='rat';toast('🐀 Un rat te suit désormais !')}if(n==5&&!PET.have.bat){PET.have.bat=1;PET.cur='bat';toast('🦇 Une chauve-souris te suit !')}if(n==DGMAX){INV.coins+=500;giveGem();giveGem();if(!own.includes('tg')){own.push('tg');setTimeout(()=>toast('👑 Armure dorée du Roi obtenue !'),1500)}toast('👑 Roi du donjon vaincu ! Étage 10 terminé !')}else toast('Gardien vaincu ! L’escalier descend vers l’étage '+(n+1));sfx(660,.4,'triangle',.07)}
function portalUpd(dt){if(P.dead||dlg)return;if(!DG){PT.cd=Math.max(0,PT.cd-dt);if(!PT.cd&&Math.hypot(P.x-PT.x,P.y-PT.y)<22)dgAsk();return}
if(DG.ec>0)DG.ec-=dt;DG.tt+=dt;
if(!DG.key&&E.filter(e=>e.rm==1).every(e=>e.dead)){DG.key=1;toast('🗝 Clé trouvée !');sfx(880,.2,'triangle',.06)}
if(DG.key&&!DG.dOpen&&Math.hypot(P.x-(OX+24*32+16),P.y-(OY+8*32))<46){DG.dOpen=1;DG.g[7][24]=DG.g[8][24]='.';toast('Porte déverrouillée');sfx(300,.3,'square',.06)}
if(!DG.lv&&Math.hypot(P.x-DG.lever.x,P.y-DG.lever.y)<26){DG.lv=1;DG.g[7][36]=DG.g[8][36]='.';toast('⚙ Une herse se lève !');if(DG.n>=7){for(let k=0;k<4;k++){const p=dgPos(2);E.push(dgCrit(OX+p[0]*32+16,OY+p[1]*32+16,2,k%2?'bat':'rat'))}toast('⚠ Embuscade !')}sfx(200,.5,'sawtooth',.06)}
for(const c of DG.chests)if(!c.o&&Math.hypot(P.x-c.x,P.y-c.y)<24){c.o=1;const v=40+c.n*25;INV.coins+=v;P.mat+=c.n>=5?3:1;if(c.n>=5)giveGem();toast('📦 Coffre : +'+v+' pièces');sfx(700,.25,'triangle',.07)}
const tx=Math.floor((P.x-OX)/32),ty=Math.floor((P.y+6-OY)/32),tc=DG.g[ty]&&DG.g[ty][tx];
if(tc=='S'&&(DG.tt%2)>1.5)hurtP(1+Math.floor(DG.n/4));if(tc=='L'){DG.lt-=dt;if(DG.lt<=0){DG.lt=.5;if(P.inv<=0)hurtP(2+Math.floor(DG.n/3))}}
if(DG.ec<=0)for(const [i,p] of DG.ex.entries()){if(i==1&&!DG.bossDead)continue;if(Math.hypot(P.x-p.x,P.y-p.y)<22){const n=DG.n;if(i==0){if(n==1){exitDG();return}loadFloor(n-1,1)}else{if(n>=DGMAX){exitDG();return}loadFloor(n+1,0)}sfx(500,.3,'triangle',.06);return}}}
function gbAI(e,d,dt){if(e.dash>0){e.dash-=dt;move(e,e.dx*220*dt,e.dy*220*dt);if(Math.hypot(P.x-e.x,P.y-e.y)<24)hurtP(e.dmg+1);if(e.dash<=0){e.st='chase';e.cool=1.6}return}
if(e.st=='wind'){e.w+=dt;if(e.w>.7){e.st='chase';e.cool=e.hp<e.max/2?1.6:2.6;const a=Math.atan2(P.y-e.y,P.x-e.x),p=e.pat%(DG&&DG.n>=8?5:DG&&DG.n>=5?4:3);if(p==0){const n=e.hp<e.max/2?14:9;for(let i=0;i<n;i++){const t=i/n*6.283;EP.push({x:e.x,y:e.y,dx:Math.cos(t),dy:Math.sin(t),t:0,dmg:e.dmg})}sfx(160,.4,'sawtooth',.06)}else if(p==1){e.dash=.5;e.dx=Math.cos(a);e.dy=Math.sin(a);sfx(120,.4,'sawtooth',.06)}else if(p==2){for(let i=0;i<2;i++)E.push(dgSpawn(e.x+(i?36:-36),e.y+12,3));toast('Des squelettes surgissent !')}else if(p==3){for(let i=-3;i<=3;i++)EP.push({x:e.x,y:e.y,dx:Math.cos(a+i*.22),dy:Math.sin(a+i*.22),t:0,dmg:e.dmg});sfx(200,.4,'sawtooth',.06);toast('Éventail d’os !')}else{const n=10;for(let i=0;i<n;i++){const t=i/n*6.283+T;EP.push({x:P.x+Math.cos(t)*150,y:P.y+Math.sin(t)*150,dx:-Math.cos(t),dy:-Math.sin(t),t:0,dmg:e.dmg})}sfx(140,.5,'sawtooth',.06);toast('Encerclement !')}e.pat++}return}
if(!P.dead&&d<420&&P.x>OX+36*32){const a=Math.atan2(P.y-e.y,P.x-e.x);e.dir=Math.cos(a)>0?1:-1;if(d>70)move(e,Math.cos(a)*e.sp*dt,Math.sin(a)*e.sp*dt);if(e.cool<=0){e.st='wind';e.w=0}}else e.st='idle'}
