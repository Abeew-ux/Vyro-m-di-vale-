<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Chroniques de la Forêt</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#14201a;--panel:#241a12;--edge:#b8924a;--ink:#f0e2c0;--hp:#c0392b;--xp:#5aa5d6;color-scheme:dark}
html,body{position:fixed;inset:0;width:100%;overscroll-behavior:none;margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:"Pixelify Sans",ui-monospace,monospace;color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated}#c{position:fixed;inset:0;touch-action:none}
.p{background:linear-gradient(#3b2a19,#25180c);border:3px solid #c9a45c;border-radius:8px;box-shadow:0 0 0 2px #140b04,inset 0 0 0 2px #6b4a22,0 6px 14px #0009;padding:7px 10px;font-size:14px;line-height:1.35}
#inv{z-index:30}#dlg{z-index:20}#bagb,#mute{z-index:10}
#inv h3{margin:0 0 6px;font-size:21px;text-align:center;letter-spacing:1px;color:#ffd34d;text-shadow:2px 2px #000;font-weight:600}
#inv.board{background:linear-gradient(#efe0b0,#d3bb7b);color:#3a2410;border-color:#6b4524;box-shadow:0 0 0 2px #140b04,inset 0 0 22px #8a6a30aa,0 6px 14px #0009}
#inv.board h3{color:#5a2a0a;text-shadow:none}#inv.board hr{border-color:#6b452455}
.card{display:flex;gap:8px;align-items:center;padding:6px;margin:6px 0;background:#0003;border:2px solid #0005;border-radius:8px}
.board .card{background:#fff6;border-color:#6b4524aa}
.card .ic{width:40px;height:40px;image-rendering:pixelated;flex:none}.card .t{flex:1;line-height:1.25;font-size:14px}.card .em{font-size:30px;width:40px;text-align:center;flex:none}
.slots{display:flex;gap:8px;justify-content:center;margin:8px 0}
.slot{width:68px;border:2px solid #6b4a22;background:#0006;border-radius:8px;text-align:center;font-size:11px;padding:3px}.slot.on{border-color:#ffd34d;box-shadow:0 0 8px #ffd34d88}
.slot img,.cell img{width:46px;height:46px;image-rendering:pixelated;display:block;margin:2px auto}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:4px}
.cell{border:2px solid #6b4a22;background:#0006;border-radius:8px;padding:3px;text-align:center;font-size:11px;line-height:1.2}.cell.on{border-color:#ffd34d;box-shadow:0 0 8px #ffd34d88}
#hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:calc(env(safe-area-inset-left,0px) + 10px);right:calc(env(safe-area-inset-right,0px) + 10px);display:flex;gap:10px;justify-content:space-between;align-items:flex-start;pointer-events:none}
.bar{height:9px;background:#000;margin-top:4px;width:130px}.bar i{display:block;height:100%}
#hp i{background:var(--hp)}#xp{height:5px}#xp i{background:var(--xp)}#sta{height:5px}#sta i{background:#e0c050}#mm{position:fixed;left:calc(env(safe-area-inset-left,0px) + 10px);top:calc(env(safe-area-inset-top,0px) + 142px);width:96px;border:2px solid var(--edge);border-radius:4px;pointer-events:none;image-rendering:pixelated}#dodge{position:fixed;right:calc(env(safe-area-inset-right,0px) + 20px);bottom:calc(env(safe-area-inset-bottom,0px) + 152px);width:46px;height:46px;border-radius:50%;border:2px solid var(--edge);background:#2a4a6acc;color:#fff;font-size:20px;margin:0;padding:0}
#quest{max-width:48vw;text-align:right}#quest b{font-weight:600}
#dlg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 96px);width:min(560px,92vw);box-sizing:border-box;display:none;gap:10px;align-items:flex-start;font-size:16px;min-height:70px;padding:12px}
#dnm{position:absolute;top:-17px;left:16px;background:#c9a45c;color:#2a1708;font-weight:600;padding:1px 14px;border-radius:6px 6px 0 0;font-size:14px}
#dpt{width:64px;height:64px;border:2px solid #6b4a22;background:radial-gradient(#3d5a3c,#16261a);border-radius:8px;image-rendering:pixelated;flex:none}
#dbody{flex:1}#dbody small{display:block;text-align:right;opacity:.65;margin-top:4px;font-size:12px}
#toast{position:fixed;top:28%;left:0;right:0;text-align:center;font-size:24px;font-weight:600;text-shadow:2px 2px #000;pointer-events:none;opacity:0;transition:opacity .4s}
#ctl{display:none}
#inv{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(340px,90vw);max-height:80vh;overflow:auto;display:none;font-size:15px;line-height:1.9}
#inv button,#bagb,#pot,#mute{font:inherit;background:#3a2a1a;color:var(--ink);border:2px solid var(--edge);padding:5px 9px;margin:3px 3px 0 0;border-radius:4px}
#mute{position:fixed;left:calc(env(safe-area-inset-left,0px) + 66px);top:calc(env(safe-area-inset-top,0px) + 112px);font-size:20px;margin:0}
#bagb{position:fixed;left:calc(env(safe-area-inset-left,0px) + 10px);top:calc(env(safe-area-inset-top,0px) + 112px);font-size:20px;margin:0}
#pot{position:fixed;right:calc(env(safe-area-inset-right,0px) + 34px);bottom:calc(env(safe-area-inset-bottom,0px) + 140px);width:42px;height:42px;border-radius:50%;font-size:19px;margin:0;padding:0}
@media(pointer:coarse){#ctl{display:block}}
#stick{position:fixed;left:calc(env(safe-area-inset-left,0px) + 24px);bottom:calc(env(safe-area-inset-bottom,0px) + 24px);width:92px;height:92px;border-radius:50%;border:2px solid var(--edge);background:#0006}
#knob{position:absolute;left:31px;top:31px;width:30px;height:30px;border-radius:50%;background:var(--edge);opacity:.8}
#atk{position:fixed;right:calc(env(safe-area-inset-right,0px) + 28px);bottom:calc(env(safe-area-inset-bottom,0px) + 34px);width:66px;height:66px;border-radius:50%;border:3px solid var(--edge);background:#7a2a1fcc;color:var(--ink);font:600 26px "Pixelify Sans",sans-serif;display:flex;align-items:center;justify-content:center}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);font-size:20px}
#atk{right:calc(env(safe-area-inset-right,0px) + 20px);bottom:calc(env(safe-area-inset-bottom,0px) + 28px)}
#pot{right:calc(env(safe-area-inset-right,0px) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 102px)}
.spb{position:fixed;width:42px;height:42px;border-radius:50%;font-size:17px;display:none;margin:0;padding:0;border:2px solid #ffd34d;background:#5a3a10e0;color:#fff;z-index:5}
#sp1{right:calc(env(safe-area-inset-right,0px) + 94px);bottom:calc(env(safe-area-inset-bottom,0px) + 24px)}
#sp2{right:calc(env(safe-area-inset-right,0px) + 72px);bottom:calc(env(safe-area-inset-bottom,0px) + 78px)}
#bagb,#mute{font-size:15px;padding:3px 7px;top:calc(env(safe-area-inset-top,0px) + 104px)}
#mm{height:auto!important}
#atk{width:56px;height:56px;font-size:21px;right:calc(env(safe-area-inset-right,0px) + 16px);bottom:calc(env(safe-area-inset-bottom,0px) + 22px)}
#dodge{width:38px;height:38px;font-size:16px;right:calc(env(safe-area-inset-right,0px) + 82px);bottom:calc(env(safe-area-inset-bottom,0px) + 22px)}
#sp1{width:36px;height:36px;font-size:14px;right:calc(env(safe-area-inset-right,0px) + 82px);bottom:calc(env(safe-area-inset-bottom,0px) + 70px)}
#pot{width:36px;height:36px;font-size:15px;right:calc(env(safe-area-inset-right,0px) + 16px);bottom:calc(env(safe-area-inset-bottom,0px) + 90px)}
#sp2{width:36px;height:36px;font-size:14px;right:calc(env(safe-area-inset-right,0px) + 64px);bottom:calc(env(safe-area-inset-bottom,0px) + 118px)}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><div class="p"><div id="lv">Niv. 1</div><div class="bar" id="hp"><i></i></div><div class="bar" id="xp"><i></i></div><div class="bar" id="sta"><i></i></div></div><div class="p" id="quest"></div></div>
<div id="dlg" class="p"><div id="dnm"></div><canvas id="dpt" width="48" height="48"></canvas><div id="dbody"><div id="dt"></div><small>▼ Espace ou toucher</small></div></div>
<div id="toast"></div><canvas id="mm" width="96" height="64"></canvas><div id="inv" class="p"></div><button id="bagb">🎒</button><button id="mute">🔊</button><button id="sp1" class="spb">⚡</button><button id="sp2" class="spb">🌀</button>
<div id="ctl"><div id="stick"><div id="knob"></div></div><div id="atk">⚔</div><button id="dodge">💨</button><button id="pot">🧪</button></div>
<div id="load">Chargement…</div>

let ac;function sfx(f,d=.08,t='square',v=.04){if(muted)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
let master,muted=false,combat=false,mus=0;
function pl(f,t,d,ty,v){const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05)}
const mf=m=>440*2**((m-69)/12);
const CE=[[55,59,62,67],[50,54,57,62],[52,55,59,64],[48,52,55,60]],CC=[[52,55,59,64],[48,52,55,60],[55,59,62,67],[50,54,57,62]];
const PN=[67,69,71,74,76,79],ML=[3,-1,-1,4,5,-1,4,-1,2,-1,3,-1,-1,-1,1,-1,2,-1,-1,3,4,-1,3,-1,1,-1,2,-1,0,-1,-1,-1],LD=[0,-1,2,-1,3,2,-1,0,3,-1,2,-1,1,-1,2,-1];
function nz(t,d,v,f){const n=ac.sampleRate*d|0,b=ac.createBuffer(1,n,ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=ac.createBufferSource(),g=ac.createGain(),h=ac.createBiquadFilter();h.type='highpass';h.frequency.value=f;g.gain.value=v;s.buffer=b;s.connect(h);h.connect(g);g.connect(master);s.start(t)}
function kick(t,v){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(40,t+.14);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.connect(g);g.connect(master);o.start(t);o.stop(t+.2)}
function startMusic(){if(mus||muted)return;try{ac=ac||new AudioContext();if(ac.state=='suspended')ac.resume();master=ac.createGain();master.gain.value=.7;master.connect(ac.destination)}catch(e){return}
let nx=ac.currentTime+.15,i=0,md=0;mus=setInterval(()=>{while(nx<ac.currentTime+.5){const s=i%8,ci=(i>>3)%4;if(s==0)md=combat?1:0;
if(!md){const c=CE[ci];pl(mf(c[[0,1,2,3,2,1,2,1][s]]),nx,.55,'triangle',.07);if(s==0){pl(mf(c[0]-12),nx,2.6,'sine',.07);pl(mf(c[1]-12),nx,2.6,'sine',.04);pl(mf(c[0]-24),nx,1.5,'triangle',.1)}if(s==4)pl(mf(c[0]-17),nx,1,'triangle',.07);
const m=ML[i%32];if(m>=0){pl(mf(PN[m]),nx,.9,'sine',.09);pl(mf(PN[m]+12),nx,.5,'triangle',.015)}}
else{const c=CC[ci];pl(mf(c[0]-24),nx,.2,'sawtooth',.06);if(s%2==0)pl(mf(c[0]-12),nx,.15,'square',.03);const l=LD[i%16];if(l>=0)pl(mf(c[l%4]+12),nx,.22,'sawtooth',.035);if(s%4==0)kick(nx,.3);if(s%4==2)nz(nx,.12,.12,1500);nz(nx,.03,.03,6000)}
nx+=md?.17:.3;i++}},120)}
function tint(img,fn){const c=document.createElement('canvas');c.width=img.width;c.height=img.height;const x=c.getContext('2d');x.drawImage(img,0,0);const d=x.getImageData(0,0,c.width,c.height),p=d.data;for(let i=0;i<p.length;i+=4){const o=fn(p[i],p[i+1],p[i+2],(i>>2)%c.width,((i>>2)/c.width)|0);p[i]=o[0];p[i+1]=o[1];p[i+2]=o[2]}x.putImageData(d,0,0);return c}

DG={g,key:0,lv:0,dOpen:0,bossDead:0,ec:1.5,ret:{x:PT.x,y:PT.y+46},lever:{x:OX+30*32+16,y:OY+5*32+20},ex:[{x:OX+4*32+16,y:OY+8*32},{x:OX+44*32,y:OY+10*32}]};P.x=OX+6*32;P.y=OY+8*32;camX=null;
for(const [x,y] of [[16,6],[20,6],[16,10],[20,10]])E.push(dgSpawn(OX+x*32+16,OY+y*32+16,1));
for(const [x,y] of [[28,6],[32,6],[28,10],[32,10],[30,8]])E.push(dgSpawn(OX+x*32+16,OY+y*32+16,2));
const b=spawnE(true);b.boss=false;b.gb=1;b.kind='gb';b.set=DBS;b.sc=1.8;b.hp=b.max=Math.round(90*(1+(P.lvl-1)*.12));b.dmg=4+((P.lvl-1)>>2);b.sp=46;b.x=b.hx=OX+45*32;b.y=b.hy=OY+8*32;b.pat=0;b.rm=3;b.cool=2;E.push(b);toast('🕳 Donjon des Ossements (niv. conseillé 4)');sfx(120,.6,'sawtooth',.06)}
function exitDG(){if(!DG)return;E.length=0;E.push(...OVER);OVER=null;EP.length=0;for(let i=drops.length-1;i>=0;i--)if(drops[i].x>W)drops.splice(i,1);P.x=DG.ret.x;P.y=DG.ret.y;DG=null;camX=null;PT.cd=2;sfx(500,.3,'triangle',.06)}
function dgBossDead(){DG.bossDead=1;INV.coins+=150;P.mat+=10;giveGem();giveGem();if(!own.includes('w3'))giveItem('w3');toast('Gardien vaincu ! Un portail apparaît');sfx(660,.4,'triangle',.07)}
function portalUpd(dt){if(P.dead||dlg)return;if(!DG){PT.cd=Math.max(0,PT.cd-dt);if(!PT.cd&&Math.hypot(P.x-PT.x,P.y-PT.y)<22)enterDG();return}
if(DG.ec>0)DG.ec-=dt;
if(!DG.key&&E.filter(e=>e.rm==1).every(e=>e.dead)){DG.key=1;toast('🗝 Clé trouvée !');sfx(880,.2,'triangle',.06)}
if(DG.key&&!DG.dOpen&&Math.hypot(P.x-(OX+24*32+16),P.y-(OY+8*32))<46){DG.dOpen=1;DG.g[7][24]=DG.g[8][24]='.';toast('Porte déverrouillée');sfx(300,.3,'square',.06)}
if(!DG.lv&&Math.hypot(P.x-DG.lever.x,P.y-DG.lever.y)<26){DG.lv=1;DG.g[7][36]=DG.g[8][36]='.';toast('⚙ Une herse se lève !');sfx(200,.5,'sawtooth',.06)}
if(DG.ec<=0)for(const [i,p] of DG.ex.entries()){if(i==1&&!DG.bossDead)continue;if(Math.hypot(P.x-p.x,P.y-p.y)<22){exitDG();return}}}
function gbAI(e,d,dt){if(e.dash>0){e.dash-=dt;move(e,e.dx*220*dt,e.dy*220*dt);if(Math.hypot(P.x-e.x,P.y-e.y)<24)hurtP(e.dmg+1);if(e.dash<=0){e.st='chase';e.cool=1.6}return}
if(e.st=='wind'){e.w+=dt;if(e.w>.7){e.st='chase';e.cool=e.hp<e.max/2?1.6:2.6;const a=Math.atan2(P.y-e.y,P.x-e.x),p=e.pat%3;if(p==0){const n=e.hp<e.max/2?14:9;for(let i=0;i<n;i++){const t=i/n*6.283;EP.push({x:e.x,y:e.y,dx:Math.cos(t),dy:Math.sin(t),t:0,dmg:e.dmg})}sfx(160,.4,'sawtooth',.06)}else if(p==1){e.dash=.5;e.dx=Math.cos(a);e.dy=Math.sin(a);sfx(120,.4,'sawtooth',.06)}else{for(let i=0;i<2;i++)E.push(dgSpawn(e.x+(i?36:-36),e.y+12,3));toast('Des squelettes surgissent !')}e.pat++}return}
if(!P.dead&&d<420&&P.x>OX+36*32){const a=Math.atan2(P.y-e.y,P.x-e.x);e.dir=Math.cos(a)>0?1:-1;if(d>70)move(e,Math.cos(a)*e.sp*dt,Math.sin(a)*e.sp*dt);if(e.cool<=0){e.st='wind';e.w=0}}else e.st='idle'}
const T0=document.createElement('div');T0.style.cssText='position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(#1c2b20cc,#0a120ef2);text-align:center;font-family:"Pixelify Sans",monospace';
T0.innerHTML='<div style="font-size:clamp(30px,9vw,54px);font-weight:600;color:#ffd34d;text-shadow:3px 3px #000;letter-spacing:2px">Chroniques<br>de la Forêt</div><div style="opacity:.7;margin-bottom:8px">⚔ Un RPG médiéval ⚔</div>';
const tb=(t,f)=>{const b=document.createElement('button');b.textContent=t;b.style.cssText='font:inherit;font-size:20px;width:min(260px,80vw);padding:10px;background:#3a2a1a;color:#f0e2c0;border:3px solid #b8924a;border-radius:6px';b.onclick=f;T0.appendChild(b);return b};
const go=()=>{TITLE=false;T0.remove();startMusic()};
if(SAVED)tb('▶ Continuer (Niv. '+SAVED.l+')',()=>{loadG(SAVED);go();toast('Partie chargée')});
let newB;newB=tb('✨ Nouvelle partie',()=>{if(SAVED&&newB.dataset.c!='1'){newB.dataset.c='1';newB.textContent='⚠ Effacer la sauvegarde ?';return}try{localStorage.removeItem(SK)}catch(e){}go();say(['Chevalier, les morts se réveillent dans la forêt…','Va voir le tableau des missions, près du village.'],0,NPCS[0])});
document.body.appendChild(T0);
const GLOW=(()=>{const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d'),r=g.createRadialGradient(64,64,2,64,64,64);r.addColorStop(0,'rgba(255,150,50,1)');r.addColorStop(1,'rgba(255,100,20,0)');g.fillStyle=r;g.fillRect(0,0,128,128);return c})();
{const ds=Object.getOwnPropertyDescriptor(Element.prototype,'innerHTML');for(const id of['lv','quest']){const e=$(id);let last=null;Object.defineProperty(e,'innerHTML',{configurable:true,get(){return ds.get.call(e)},set(v){if(v!==last){last=v;ds.set.call(e,v)}}})}}
requestAnimationFrame(frame);setTimeout(()=>toast('Pince avec 2 doigts pour zoomer'),900)}
